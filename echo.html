<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="echo-LOOG-2.png">
    <title>Echo Scratch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* Logo 超级放大 */
        .logo img {
            height: 130px;
            margin-bottom: 50px;
        }
        /* 搜索框超大 */
        .search-form {
            width: 750px;
            display: flex;
        }
        .search-form input {
            flex: 1;
            height: 58px;
            font-size: 18px;
            padding: 0 25px;
            border: 1px solid #ddd;
            border-radius: 30px 0 0 30px;
            outline: none;
        }
        .search-form button {
            height: 58px;
            width: 90px;
            font-size: 18px;
            border: none;
            background: #0078d4;
            color: #fff;
            border-radius: 0 30px 30px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 顶部LOGO echo-LOOG.png -->
<div class="logo">
    <img src="echo-LOOG.png" alt="">
</div>

<!-- 重点：target="_blank" 新建标签页跳转 -->
<form class="search-form" action="https://www.bing.com/search" method="get" target="_blank">
    <input type="text" name="q" placeholder="输入内容进行搜索">
    <button type="submit">搜索</button>
</form>

</body>
</html>
